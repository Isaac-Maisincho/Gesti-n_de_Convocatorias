# ==========================================
# Docker Compose — Sistema de Gestión de Convocatorias
# ==========================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion-convocatorias-app
    restart: unless-stopped
    ports:
      - "${LOCAL_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
